<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ST Preview Tool – Sehat Tentrem</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #c9a84c; --gold-light: #e8c97a;
      --gold-dim: rgba(201,168,76,0.12);
      --dark: #08080a; --dark-2: #0e0e12; --dark-3: #161619;
      --dark-4: #1e1e22; --dark-5: #28282e;
      --border: rgba(201,168,76,0.15); --border-2: rgba(255,255,255,0.06);
      --text: #e8e8e0; --text-dim: #6a6a66; --green: #34d399;
      --ease: cubic-bezier(0.4,0,0.2,1);
    }
    html, body {
      height: 100%; background: var(--dark); color: var(--text);
      font-family: 'Inter', sans-serif; overflow: hidden; user-select: none;
    }

    /* ── TOPBAR ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 54px;
      background: rgba(14,14,18,0.92); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-2);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; z-index: 200;
    }
    .topbar__brand { display: flex; align-items: center; gap: 10px; }
    .topbar__logo {
      width: 30px; height: 30px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 11px; color: #0a0a0a;
    }
    .topbar__title { font-size: 13px; font-weight: 500; color: var(--text-dim); }
    .topbar__title b { color: var(--gold); font-weight: 600; }

    /* ── SWITCHER ── */
    .switcher {
      display: flex; align-items: center; gap: 2px;
      background: var(--dark-3); border: 1px solid var(--border-2);
      border-radius: 10px; padding: 3px;
    }
    .sw-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 14px; border: none; background: transparent;
      color: var(--text-dim); font-family: inherit; font-size: 12px;
      font-weight: 500; border-radius: 7px; cursor: pointer;
      transition: all 0.3s var(--ease); white-space: nowrap;
    }
    .sw-btn:hover { color: var(--text); background: var(--dark-4); }
    .sw-btn.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: #0a0a0a; font-weight: 700;
      box-shadow: 0 2px 10px rgba(201,168,76,0.25);
    }
    .sw-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    .topbar__center { display: flex; align-items: center; gap: 8px; }
    .divider { width: 1px; height: 22px; background: var(--border-2); }

    .tool-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px; border: 1px solid var(--border-2);
      background: var(--dark-3); color: var(--text-dim);
      font-family: inherit; font-size: 12px; font-weight: 500;
      border-radius: 8px; cursor: pointer; transition: all 0.3s var(--ease);
    }
    .tool-btn:hover { color: var(--text); border-color: var(--border); }
    .tool-btn.active { background: var(--gold-dim); color: var(--gold); border-color: rgba(201,168,76,0.4); }
    .tool-btn svg { width: 14px; height: 14px; }

    .topbar__right { display: flex; align-items: center; gap: 10px; }
    .vp-label {
      font-size: 11px; color: var(--text-dim); background: var(--dark-3);
      border: 1px solid var(--border-2); padding: 4px 10px;
      border-radius: 6px; min-width: 100px; text-align: center;
    }
    .vp-label b { color: var(--gold); }
    .open-link {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 14px; background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.3); border-radius: 8px;
      color: var(--gold); font-family: inherit; font-size: 12px;
      font-weight: 500; text-decoration: none; transition: all 0.3s var(--ease);
    }
    .open-link:hover { background: var(--gold); color: #0a0a0a; }

    /* ── STAGE ── */
    .stage {
      position: fixed; top: 54px; left: 0; right: 0; bottom: 26px;
      display: flex; align-items: center; justify-content: center;
      overflow: auto; padding: 20px;
      background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.03) 0%, transparent 60%), var(--dark);
    }
    .stage::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(201,168,76,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* ── SINGLE VIEW ── */
    #single-view { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
    #single-view.hide { display: none; }

    /* ── ENTIRE VIEW ── */
    #entire-view {
      display: none; align-items: flex-end; justify-content: center;
      gap: 28px; position: relative; z-index: 1;
    }
    #entire-view.show { display: flex; }
    .e-col {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      animation: popIn 0.45s var(--ease) both;
    }
    .e-col:nth-child(2) { animation-delay: .08s; }
    .e-col:nth-child(3) { animation-delay: .16s; }
    @keyframes popIn { from { opacity:0; transform: translateY(16px) scale(0.97); } to { opacity:1; transform: none; } }
    .e-col .e-title {
      font-size: 10px; font-weight: 600; color: var(--gold);
      text-transform: uppercase; letter-spacing: 0.12em;
    }
    .e-col .e-size { font-size: 9px; color: var(--text-dim); }

    /* ── DEVICE SHELLS ── */
    /* -- Desktop / Laptop -- */
    .shell-desktop .screen {
      background: #111; border-radius: 8px 8px 0 0;
      border: 2px solid #2a2a2e; border-bottom: none;
      overflow: hidden; position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 60px rgba(201,168,76,0.03);
    }
    .shell-desktop .notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 60px; height: 4px; background: #0a0a0a; border-radius: 0 0 3px 3px; z-index: 5;
    }
    .shell-desktop .chin {
      height: 14px; background: linear-gradient(180deg, #1c1c20, #2a2a2e);
      border-radius: 0 0 3px 3px;
    }
    .shell-desktop .stand {
      width: 120px; height: 8px; margin: 0 auto;
      background: linear-gradient(180deg, #2a2a2e, #222); border-radius: 0 0 5px 5px;
    }

    /* -- Tablet (iPad Air ratio) -- */
    .shell-tablet .screen {
      background: #111; border-radius: 16px;
      border: 7px solid #1c1c20; overflow: hidden; position: relative;
      box-shadow: 0 0 0 1px #2a2a2e, 0 20px 50px rgba(0,0,0,0.5);
    }
    .shell-tablet .screen::after {
      content: ''; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
      width: 5px; height: 5px; background: #0a0a0a; border-radius: 50%;
      border: 1px solid #333; z-index: 5;
    }

    /* -- Mobile (iPhone 15 = 393×852, ratio 1:2.168) -- */
    .shell-mobile .screen {
      background: #111; border-radius: 36px;
      border: 7px solid #1c1c20; overflow: hidden; position: relative;
      box-shadow: 0 0 0 1px #2a2a2e, 0 20px 50px rgba(0,0,0,0.5);
    }
    .shell-mobile .screen::after {
      content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 90px; height: 24px; background: #0a0a0a; border-radius: 14px;
      z-index: 5; pointer-events: none;
    }
    .shell-mobile .screen::before {
      content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
      width: 80px; height: 4px; background: #333; border-radius: 2px;
      z-index: 5; pointer-events: none;
    }

    /* iframe inside screens */
    .screen iframe {
      width: 100%; height: 100%; border: none; display: block; background: #fff;
    }

    .dev-label {
      margin-top: 6px; font-size: 9px; color: var(--text-dim);
      letter-spacing: 0.08em; text-transform: uppercase; text-align: center;
    }

    /* ══ SINGLE MODE SIZES ══ */
    #single-view .shell-desktop .screen { width: min(1280px, calc(100vw - 48px)); height: calc(100vh - 54px - 26px - 80px); }
    #single-view .shell-desktop .chin { width: min(1380px, calc(100vw - 28px)); }

    #single-view .shell-tablet .screen { width: 820px; max-width: calc(100vw - 60px); height: calc(100vh - 54px - 26px - 60px); }

    #single-view .shell-mobile .screen { width: 393px; max-width: calc(100vw - 60px); height: calc(100vh - 54px - 26px - 60px); }

    /* ══ ENTIRE MODE SIZES ══ */
    #entire-view .shell-desktop .screen { width: 580px; height: 362px; }
    #entire-view .shell-desktop .chin { width: 620px; }

    #entire-view .shell-tablet .screen { width: 280px; height: 386px; }

    #entire-view .shell-mobile .screen {
      width: 186px; height: 403px; /* iPhone 15 ratio 393:852 scaled */
      border-radius: 24px;
    }
    #entire-view .shell-mobile .screen::after { width: 50px; height: 16px; top: 5px; border-radius: 9px; }
    #entire-view .shell-mobile .screen::before { width: 46px; bottom: 3px; height: 3px; }

    /* ── STATUS BAR ── */
    .statusbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 26px;
      background: rgba(14,14,18,0.92); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-2);
      display: flex; align-items: center; padding: 0 14px; gap: 16px; z-index: 200;
    }
    .st-item { font-size: 10px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
    .st-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

    /* ── RESPONSIVE ── */
    @media (max-width: 1100px) {
      #entire-view .shell-desktop .screen { width: 420px; height: 262px; }
      #entire-view .shell-desktop .chin { width: 450px; }
      #entire-view .shell-tablet .screen { width: 220px; height: 304px; }
      #entire-view .shell-mobile .screen { width: 150px; height: 325px; }
    }
    @media (max-width: 860px) {
      .vp-label, .open-link, .topbar__title { display: none; }
      #entire-view { flex-wrap: wrap; gap: 16px; }
      #entire-view .shell-desktop .screen { width: 80vw; height: 240px; }
      #entire-view .shell-desktop .chin { width: calc(80vw + 30px); }
    }
    @media (max-width: 560px) {
      .sw-btn span { display: none; }
      .sw-btn { padding: 6px 9px; }
      .tool-btn span { display: none; }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar__brand">
      <div class="topbar__logo">ST</div>
      <span class="topbar__title">Preview <b>Sehat Tentrem</b></span>
    </div>
    <div class="topbar__center">
      <div class="switcher" id="switcher">
        <button class="sw-btn active" data-mode="desktop" onclick="setMode('desktop')" title="Desktop (1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M2 21h20"/></svg>
          <span>Desktop</span>
        </button>
        <button class="sw-btn" data-mode="tablet" onclick="setMode('tablet')" title="Tablet (2)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>
          <span>Tablet</span>
        </button>
        <button class="sw-btn" data-mode="mobile" onclick="setMode('mobile')" title="Mobile (3)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="18" r="1"/></svg>
          <span>Mobile</span>
        </button>
      </div>
      <div class="divider"></div>
      <button class="tool-btn" id="btn-entire" onclick="toggleEntire()" title="Semua Device (E)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="8" height="6" rx="1"/><rect x="14" y="3" width="8" height="6" rx="1"/><rect x="2" y="13" width="8" height="6" rx="1"/><rect x="14" y="13" width="8" height="6" rx="1"/></svg>
        <span>Entire</span>
      </button>
    </div>
    <div class="topbar__right">
      <div class="vp-label" id="vp-label"><b>1280</b> × <b>800</b></div>
      <a href="index.html" target="_blank" class="open-link">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Buka Penuh
      </a>
    </div>
  </header>

  <!-- STAGE -->
  <main class="stage">

    <!-- ═══ SINGLE DEVICE VIEW ═══ -->
    <div id="single-view">
      <!-- Desktop Shell -->
      <div class="shell-desktop" id="shell-desktop">
        <div class="screen"><div class="notch"></div><iframe src="index.html" title="Preview"></iframe></div>
        <div class="chin"></div><div class="stand"></div>
      </div>
      <!-- Tablet Shell -->
      <div class="shell-tablet" id="shell-tablet" style="display:none">
        <div class="screen"><iframe src="index.html" title="Preview"></iframe></div>
      </div>
      <!-- Mobile Shell (iPhone 15 — 393×852) -->
      <div class="shell-mobile" id="shell-mobile" style="display:none">
        <div class="screen"><iframe src="index.html" title="Preview"></iframe></div>
      </div>
      <div class="dev-label" id="dev-label">MacBook Pro · 1280 × 800</div>
    </div>

    <!-- ═══ ENTIRE VIEW (all 3 side-by-side) ═══ -->
    <div id="entire-view">
      <div class="e-col">
        <span class="e-title">💻 Desktop</span><span class="e-size">1280 × 800</span>
        <div class="shell-desktop">
          <div class="screen"><div class="notch"></div><iframe src="index.html" title="Desktop"></iframe></div>
          <div class="chin"></div><div class="stand"></div>
        </div>
      </div>
      <div class="e-col">
        <span class="e-title">📱 Tablet</span><span class="e-size">820 × 1180</span>
        <div class="shell-tablet">
          <div class="screen"><iframe src="index.html" title="Tablet"></iframe></div>
        </div>
      </div>
      <div class="e-col">
        <span class="e-title">📲 iPhone 15</span><span class="e-size">393 × 852</span>
        <div class="shell-mobile">
          <div class="screen"><iframe src="index.html" title="Mobile"></iframe></div>
        </div>
      </div>
    </div>

  </main>

  <!-- STATUS BAR -->
  <footer class="statusbar">
    <div class="st-item"><span class="st-dot"></span> index.html</div>
    <div class="st-item">ST Sehat Tentrem · Preview</div>
    <div class="st-item" id="st-mode" style="margin-left:auto">Mode: <b style="color:var(--gold);margin-left:3px">Desktop</b></div>
  </footer>

  <script>
    const INFO = {
      desktop: { label:'MacBook Pro · 1280 × 800', vp:'<b>1280</b> × <b>800</b>', status:'Desktop' },
      tablet:  { label:'iPad Air · 820 × 1180',    vp:'<b>820</b> × <b>1180</b>', status:'Tablet' },
      mobile:  { label:'iPhone 15 · 393 × 852',    vp:'<b>393</b> × <b>852</b>',  status:'iPhone 15' },
    };

    let mode = 'desktop';
    let entire = false;

    function setMode(m) {
      if (entire) toggleEntire();
      mode = m;
      // buttons
      document.querySelectorAll('.sw-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      // shells
      document.getElementById('shell-desktop').style.display = m === 'desktop' ? '' : 'none';
      document.getElementById('shell-tablet').style.display  = m === 'tablet'  ? '' : 'none';
      document.getElementById('shell-mobile').style.display  = m === 'mobile'  ? '' : 'none';
      // labels
      document.getElementById('dev-label').textContent = INFO[m].label;
      document.getElementById('vp-label').innerHTML = INFO[m].vp;
      document.getElementById('st-mode').innerHTML = 'Mode: <b style="color:var(--gold);margin-left:3px">' + INFO[m].status + '</b>';
    }

    function toggleEntire() {
      entire = !entire;
      document.getElementById('single-view').classList.toggle('hide', entire);
      document.getElementById('entire-view').classList.toggle('show', entire);
      document.getElementById('btn-entire').classList.toggle('active', entire);

      if (entire) {
        document.querySelectorAll('.sw-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('vp-label').innerHTML = '<b>All</b> Devices';
        document.getElementById('st-mode').innerHTML = 'Mode: <b style="color:var(--gold);margin-left:3px">Entire</b>';
      } else {
        setMode(mode);
      }
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === '1') setMode('desktop');
      if (e.key === '2') setMode('tablet');
      if (e.key === '3') setMode('mobile');
      if (e.key === 'e' || e.key === 'E') toggleEntire();
    });
  </script>

</body>
</html>
